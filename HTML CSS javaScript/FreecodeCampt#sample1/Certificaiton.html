<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
</head>
<body>

  <h1 id="title">Developer Survey Form</h1>
  <p id="description">Please fill out this form to help us improve our services.</p>

  <form id="survey-form">
    
    <div>
      <label id="name-label" for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div>
      <label id="email-label" for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>

    <div>
      <label id="number-label" for="number">Age:</label>
      <input type="number" id="number" min="10" max="100" placeholder="Enter your age" required>
    </div>

    <div>
      <label for="dropdown">Role:</label>
      <select id="dropdown">
        <option value="student">Student</option>
        <option value="professional">Professional</option>
      </select>
    </div>

    <div>
      <label>Would you recommend us?</label>
      <input type="radio" name="recommend" value="yes"> Yes
      <input type="radio" name="recommend" value="no"> No
    </div>

    <div>
      <label>Languages known:</label>
      <input type="checkbox" name="lang" value="html"> HTML
      <input type="checkbox" name="lang" value="css"> CSS
    </div>

    <div>
      <label for="comments">Any comments?</label>
      <textarea id="comments" placeholder="Enter your comments here..."></textarea>
    </div>

    <div>
      <button type="submit" id="submit">Submit</button>
    </div>

  </form>

</body>
</html>
