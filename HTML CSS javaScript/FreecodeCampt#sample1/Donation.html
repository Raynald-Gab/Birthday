<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <h1>Donation Form</h1>
  <form>
    
    <label for="fullName">Full Name:</label>
    <input id="fullName" type="text" name="name" required="required">

    <label for="emailAddress">Email Address:</label>
    <input id="emailAddress" type="email" name="email" required="required">

    <label for="donationAmount">Donation Amount ($):</label>
    <input id="donationAmount" type="number" name="amount" required="required">

    <label for="subscribe">Subscribe</label>
    <input id="subscribe" type="checkbox" name="newsletter">

    <input type="submit" value="Send">
  </form>
</body>
</html>
